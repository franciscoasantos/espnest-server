<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>EspNest</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script>navigator.serviceWorker?.register('/sw.js');</script>

  <!-- Evita flash de tema: aplica a preferência salva antes do render -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('espnest:theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style type="text/tailwindcss">
    /* A cor viva de uma fita entra por --led (canais separados por espaço, para
       caber em rgb(var(--led) / .3)). Fica em :root como acento global e é
       sobrescrita por elemento nos cards — a herança do CSS faz o resto.
       As classes abaixo são estáticas de propósito: o que muda a cada frame do
       SSE é só a custom property inline, que o Tailwind nem precisa enxergar.
       É o que permite cor viva sem build e sem gerar classe nova por frame. */
    @layer base {
      :root { --led: 113 113 122; --led-ink: 255 255 255; }
      html { -webkit-tap-highlight-color: transparent; }
      body { @apply bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100; }
      ::-webkit-scrollbar { @apply w-2 h-2; }
      ::-webkit-scrollbar-thumb { @apply rounded-full bg-zinc-300 dark:bg-zinc-700; }
      .tabular { font-variant-numeric: tabular-nums; }
      @media (prefers-reduced-motion: reduce) {
        .animate-pulse, .led-breathe, .stage-effect::after { animation: none !important; }
      }
    }

    @layer components {
      /* ----------------------------- superfícies ---------------------------- */
      .card { @apply rounded-2xl border border-zinc-200 bg-white shadow-sm dark:border-white/5 dark:bg-zinc-900/70; }
      .surface { @apply rounded-xl border border-zinc-200 bg-zinc-50 dark:border-white/5 dark:bg-zinc-900/50; }
      .muted { @apply text-zinc-500 dark:text-zinc-400; }

      /* -------------------------------- a luz ------------------------------- */
      /* O palco: a fita desenhada em 1D, do jeito que ela está agora. */
      .stage { @apply relative w-full overflow-hidden rounded-xl border border-black/5 dark:border-white/10; }
      .stage-sm { @apply h-9; }
      .stage-lg { @apply h-20; }
      .stage-off { @apply border-dashed border-zinc-300 bg-zinc-100 dark:border-zinc-700 dark:bg-zinc-900; }
      /* Brilho por cima do padrão, para a fita parecer emitir e não pintar. */
      .stage-lit::before {
        content: ""; @apply pointer-events-none absolute inset-0;
        background: linear-gradient(180deg, rgb(255 255 255 / .22), transparent 45%, rgb(0 0 0 / .18));
      }
      .stage-effect::after {
        content: ""; @apply pointer-events-none absolute inset-0;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / .30), transparent);
        animation: stage-sweep 2.6s linear infinite;
      }

      /* Amostra: o quadradinho É a fita. */
      .led-swatch {
        @apply relative shrink-0 rounded-xl border border-white/15;
        background: rgb(var(--led));
        box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 8px 24px -10px rgb(var(--led) / .85);
      }
      .led-swatch-off { @apply border-dashed border-zinc-300 dark:border-zinc-700; background: transparent; box-shadow: none; }
      .led-swatch-rainbow {
        background: conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red);
        box-shadow: 0 8px 24px -10px rgb(255 255 255 / .40);
      }

      /* Halo: a luz escapa pelo topo do card do dispositivo. */
      .led-halo { @apply relative overflow-hidden; }
      .led-halo::before {
        content: ""; @apply pointer-events-none absolute inset-x-0 top-0 h-28;
        background: radial-gradient(70% 100% at 50% 0%, rgb(var(--led) / .28), transparent 72%);
      }
      .dark .led-halo::before {
        background: radial-gradient(70% 100% at 50% 0%, rgb(var(--led) / .20), transparent 72%);
      }
      .led-halo > * { @apply relative; }

      .led-ring { box-shadow: 0 0 0 2px rgb(var(--led) / .55); }
      .led-breathe { animation: led-breathe 2.4s ease-in-out infinite; }

      /* ------------------------ controles (44px no toque) ------------------- */
      .btn {
        @apply inline-flex min-h-[44px] items-center justify-center gap-2 rounded-xl px-4 py-2 text-sm font-medium
        transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/40
        disabled:cursor-not-allowed disabled:opacity-50;
      }
      .btn-lg { @apply min-h-[52px] rounded-2xl px-5 text-base; }
      .btn-primary { @apply btn bg-indigo-600 text-white hover:bg-indigo-500; }
      .btn-ghost { @apply btn border border-zinc-300 text-zinc-700 hover:bg-zinc-100 dark:border-zinc-700 dark:text-zinc-200 dark:hover:bg-zinc-800; }
      .btn-danger { @apply btn bg-red-600 text-white hover:bg-red-500; }
      .btn-subtle { @apply btn text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-800; }
      /* O botão veste a cor da fita. A tinta vem por luminância — sem isso, um
         amarelo puro receberia texto branco e sumiria. */
      .btn-led {
        @apply btn;
        background: rgb(var(--led));
        color: rgb(var(--led-ink));
        box-shadow: 0 10px 24px -12px rgb(var(--led) / .95);
      }
      .btn-led:hover { filter: brightness(1.08); }
      .icon-btn {
        @apply inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-zinc-500 transition-colors
        hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-100;
      }

      .field {
        @apply w-full min-h-[44px] rounded-xl border border-zinc-300 bg-white px-3 py-2 text-base text-zinc-900
        placeholder:text-zinc-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 sm:text-sm
        dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 dark:placeholder:text-zinc-500;
      }
      .label { @apply mb-1.5 block text-xs font-medium uppercase tracking-wide text-zinc-500 dark:text-zinc-400; }
      .chip { @apply inline-flex min-h-[40px] items-center gap-2 rounded-full border px-3.5 py-1.5 text-[13px] font-medium transition-colors; }

      /* --------------------------- controle segmentado ---------------------- */
      .seg {
        @apply flex w-full gap-1 overflow-x-auto rounded-2xl border border-zinc-200 bg-white p-1
        dark:border-white/5 dark:bg-zinc-900 sm:w-auto;
        scrollbar-width: none;
      }
      .seg::-webkit-scrollbar { display: none; }
      .seg-item {
        @apply flex min-h-[42px] flex-1 shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl px-3
        text-sm font-medium text-zinc-500 transition-colors hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100;
      }
      .seg-item-active { @apply bg-zinc-100 text-zinc-900 dark:bg-zinc-800 dark:text-zinc-50; }

      /* ------------------------------- navegação ---------------------------- */
      .navlink {
        @apply flex min-h-[44px] items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-zinc-500 transition-colors
        hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-100;
      }
      /* O item ativo veste a cor da fita. O anel de foco continua indigo de
         propósito: indicador de acessibilidade não muda junto com a lâmpada. */
      .navlink-active {
        background: rgb(var(--led) / .14);
        color: rgb(var(--led));
      }
      .navlink-active:hover { background: rgb(var(--led) / .14); color: rgb(var(--led)); }
      .navtab { @apply flex flex-1 flex-col items-center justify-center gap-1 text-zinc-500 transition-colors dark:text-zinc-400; }
      .navtab-active { color: rgb(var(--led)); }

      /* Barra da ação primária: ao alcance do polegar e acima da bottom nav. */
      .action-bar {
        @apply sticky z-20 -mx-4 mt-4 border-t border-zinc-200 bg-zinc-50/95 px-4 py-3 backdrop-blur
        dark:border-white/5 dark:bg-zinc-950/95 sm:mx-0 sm:rounded-2xl sm:border lg:static;
        bottom: calc(4rem + env(safe-area-inset-bottom));
      }
    }

    @keyframes led-breathe {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: .78; filter: brightness(1.25); }
    }
    @keyframes stage-sweep {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <!-- Backdrop do sidebar (mobile) -->
  <div id="sidebar-backdrop" class="fixed inset-0 z-40 hidden bg-black/50 lg:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed left-0 top-0 z-50 flex h-full w-64 -translate-x-full flex-col border-r border-zinc-200 bg-white transition-transform duration-200 dark:border-zinc-800 dark:bg-zinc-900 lg:translate-x-0">
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-zinc-200 px-5 dark:border-zinc-800">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-white">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg>
      </div>
      <div>
        <div class="text-base font-bold tracking-tight">EspNest</div>
        <div class="text-[11px] muted">Controle ESP32</div>
      </div>
    </div>
    <nav id="nav-links" class="flex flex-1 flex-col gap-1 overflow-y-auto p-3"></nav>
    <div class="shrink-0 border-t border-zinc-200 p-3 dark:border-zinc-800">
      <a href="/logout" class="navlink hover:text-red-500 dark:hover:text-red-400">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
        Sair
      </a>
    </div>
  </aside>

  <!-- Conteúdo -->
  <div class="flex min-h-screen flex-col lg:pl-64">
    <!-- Topbar -->
    <header class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-zinc-200 bg-zinc-50/90 px-4 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/90 sm:px-6">
      <button id="menu-btn" class="icon-btn lg:hidden" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="h-6 w-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
      </button>
      <div class="min-w-0 flex-1">
        <h1 id="page-title" class="truncate text-lg font-semibold tracking-tight">Início</h1>
      </div>
      <!-- O badge é também o controle da barra de seleção: tocar nele abre e
           fecha a lista de dispositivos. Por isso é um <button> e aparece
           também no celular, onde antes ficava escondido abaixo de sm. -->
      <button id="conn-indicator" type="button"
              class="hidden min-h-[36px] items-center gap-2 rounded-full border border-zinc-200 px-3 py-1.5 text-xs font-medium transition-colors dark:border-zinc-800"
              aria-controls="device-bar" aria-expanded="false">
        <span id="conn-dot" class="h-2 w-2 rounded-full bg-zinc-400"></span>
        <span id="conn-text" class="muted">conectando…</span>
        <span id="conn-chevron" class="hidden text-zinc-400 dark:text-zinc-500"></span>
      </button>
      <button id="theme-btn" class="icon-btn" aria-label="Alternar tema"></button>
    </header>

    <!-- Barra global de seleção de dispositivos (mostrada nas views que usam) -->
    <div id="device-bar" class="sticky top-16 z-20 hidden border-b border-zinc-200 bg-zinc-50/90 px-4 py-2.5 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/90 sm:px-6"></div>

    <!-- View montada pelo roteador -->
    <main id="view" class="mx-auto w-full max-w-5xl flex-1 px-4 py-6 pb-[calc(7rem_+_env(safe-area-inset-bottom))] sm:px-6 lg:pb-8"></main>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 flex h-[calc(4rem_+_env(safe-area-inset-bottom))] items-stretch border-t border-zinc-200 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/95 lg:hidden"></nav>

  <div id="toast-root" class="pointer-events-none fixed right-4 top-[4.75rem] z-[60] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-2 sm:w-auto"></div>
  <div id="modal-root"></div>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
